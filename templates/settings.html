<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Price Settings</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/item_management.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/settings.css') }}">

<script src="{{ url_for('static', filename='js/settings.js') }}" defer></script>

</head>


<body>

<div class="settings-container">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="top-bar">

        <div class="top-bar-title">

            <span style="display:flex; align-items:center; gap:10px;">
                <i class="fas fa-gear"></i>
                Price Settings
            </span>

            <nav class="page-nav">
                <a href="{{ url_for('index_call') }}" class="page-nav-link">
                    <i class="fas fa-tags"></i> Items
                </a>
                <a href="{{ url_for('integration') }}" class="page-nav-link">
                    <i class="fas fa-network-wired"></i> Integration
                </a>
                <a href="{{ url_for('settings') }}" class="page-nav-link active">
                    <i class="fas fa-gear"></i> Settings
                </a>
                <a href="{{ url_for('log_message') }}" class="page-nav-link">
                    <i class="fas fa-list"></i> Logs
                </a>
            </nav>

        </div>

        <div class="settings-toolbar">

            <span class="settings-subtitle">Head office connection and site list</span>

            <button type="button" class="btn btn-outline save-btn" id="save-btn">
                <i class="fas fa-floppy-disk"></i> Save
            </button>

        </div>

    </div>


    <div class="settings-msg" id="settings-msg" hidden></div>


    <!-- =====================================================
         FORM
         ===================================================== -->

    <form id="settings-form" autocomplete="off">

        <!-- CONNECTION -->

        <section class="settings-card">

            <div class="card-head">
                <h2><i class="fas fa-plug"></i> Connection</h2>
            </div>

            <div class="settings-grid">

                <label>HO URL
                    <input type="url" name="ho_url" value="{{ settings.ho_url }}"
                           placeholder="https://ho.example.com">
                </label>

                <label>Database Port
                    <input type="number" name="db_port" value="{{ settings.db_port }}"
                           min="1" max="65535" placeholder="1433">
                </label>

                <label>DB User
                    <input type="text" name="db_user" value="{{ settings.db_user }}">
                </label>

                <label>DB Password
                    <input type="password" name="db_password" value="{{ settings.db_password }}"
                           autocomplete="new-password">
                </label>

            </div>

        </section>

        <input type="hidden" name="is_central_box" id="is_central_box" value="{{ is_central }}">

        <!-- SITES (shown only for the central app) -->

        <section class="settings-card" id="sites-card">

            <div class="card-head">
                <h2><i class="fas fa-store"></i> Sites</h2>
                <button type="button" class="btn btn-success add-row-btn" id="add-row-btn">
                    <i class="fas fa-plus"></i> Add Row
                </button>
            </div>

            <div class="sites-table-wrap">

                <table class="sites-table">

                    <thead>
                        <tr>
                            <th>Sl No</th>
                            <th>Site Location</th>
                            <th>Site IP</th>
                            <th class="col-active">Active</th>
                            <th class="col-actions">Action</th>
                        </tr>
                    </thead>

                    <!-- rows are filled by settings.js (getting data from the database) -->
                    <tbody id="sites-body"></tbody>

                </table>

            </div>

        </section>

    </form>

</div>


<!-- =====================================================
     EDIT MODAL
     ===================================================== -->

<div class="se-backdrop" id="site-edit-modal" hidden>

    <div class="se-modal" role="dialog" aria-modal="true" aria-labelledby="se-title">

        <div class="se-head">
            <h3 id="se-title"><i class="fas fa-pen"></i> Edit Site</h3>
            <button type="button" class="se-close" id="edit-close" aria-label="Close">
                <i class="fas fa-xmark"></i>
            </button>
        </div>

        <div class="se-body">

            <label>Site Location
                <input type="text" id="edit-location">
            </label>

            <label>Site IP
                <input type="text" id="edit-ip" placeholder="10.0.0.1">
            </label>

            <label class="se-check">
                <input type="checkbox" id="edit-active">
                Active
            </label>

            <div class="se-error" id="edit-error" hidden></div>

        </div>

        <div class="se-foot">
            <button type="button" class="btn btn-outline" id="edit-cancel">Cancel</button>
            <button type="button" class="btn btn-success" id="edit-save">
                <i class="fas fa-floppy-disk"></i> Update
            </button>
        </div>

    </div>

</div>


<!-- NEW row (not saved yet): inputs + delete icon that only removes it from the screen -->
<template id="site-row">
    <tr>
        <td class="sl"></td>
        <td><input type="text" class="site-location"></td>
        <td><input type="text" class="site-ip" placeholder="10.0.0.1"></td>
        <td class="col-active"><input type="checkbox" class="site-active" checked></td>
        <td class="col-actions">
            <button type="button" class="icon-btn delete remove-row-btn"
                    aria-label="Remove row" title="Remove row">
                <i class="fas fa-trash"></i>
            </button>
        </td>
    </tr>
</template>

<!-- SAVED row (from database): text + edit icon + delete icon (deletes from database) -->
<template id="site-row-db">
    <tr>
        <td class="sl"></td>
        <td class="view-location"></td>
        <td class="view-ip"></td>
        <td class="col-active"><input type="checkbox" class="view-active" disabled></td>
        <td class="col-actions">
            <button type="button" class="icon-btn edit edit-site-btn"
                    aria-label="Edit site" title="Edit">
                <i class="fas fa-pen"></i>
            </button>
            <button type="button" class="icon-btn delete delete-site-btn"
                    aria-label="Delete site" title="Delete">
                <i class="fas fa-trash"></i>
            </button>
        </td>
    </tr>
</template>

</body>

</html>
