<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Settings</title>
  <style>
    :root {
      --bg: #f6f6f7;
      --card: #fde8e6;
      /* store pink card */
      --card-solid: #fff;
      --border: #f3d3cf;
      --text: #1f2937;
      --muted: #6b7280;
      --navy: #1e2a4a;
      --ho: #b3121f;
      /* store crimson */
      --ho-dark: #8f0e19;
      --connected: #b3121f;
      /* live link = store crimson */
      --syncing: #e08a1e;
      /* warm amber */
      --disconnected: #9ca3af;
      /* offline = muted grey */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Page shell + header */
    .shell {
      position: relative;
      max-width: 1500px;
      margin: 30px auto;
      padding: 28px;
      background: #fafafc;
      border: 1px solid #eee;
      border-radius: 16px;
      overflow: hidden;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--card);
      opacity: .7;
      pointer-events: none;
    }

    .shell::before {
      width: 220px;
      height: 140px;
      top: -60px;
      right: 40px;
      transform: rotate(-20deg);
    }

    .shell::after {
      width: 160px;
      height: 160px;
      bottom: -90px;
      left: -40px;
    }

    .page-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 24px;
    }

    .pin {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--card);
      color: var(--ho);
    }

    .page-head h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--ho);
    }

    .page-head h1 span {
      color: var(--navy);
    }

    .page-head h1::after {
      content: "";
      display: block;
      width: 36px;
      height: 3px;
      margin-top: 4px;
      border-radius: 2px;
      background: var(--ho);
    }

    .page-head p {
      margin: 6px 0 0;
      font-size: .85rem;
      color: var(--muted);
    }

    .stop-all-btn {
      margin-left: auto;
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--ho);
      color: #fff;
      font-weight: 700;
      letter-spacing: .3px;
      cursor: default;
      box-shadow: 0 4px 12px rgba(179, 18, 31, .25);
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 16px;
      font-size: .9rem;
      color: var(--muted);
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
    }

    .dot.connected {
      background: var(--connected);
    }

    .dot.syncing {
      background: var(--syncing);
    }

    .dot.disconnected {
      background: var(--disconnected);
    }

    /* Dual display: site links left, detail panel right */
    .dual {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 500px) minmax(0, 1fr);
      gap: 20px;
      align-items: stretch;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .side-panel {
      padding: 8px;
      background: var(--card-solid);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(30, 42, 74, .06);
    }

    .side-inner {
      height: 100%;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      border: 1.5px dashed #f2b8b2;
      border-radius: 10px;
    }

    @media (max-width: 1000px) {
      .dual {
        grid-template-columns: 1fr;
      }

      .shell {
        margin: 16px;
        padding: 18px;
      }
    }

    .link-row {
      --color: var(--connected);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      grid-template-areas:
        "ho   title flag  chev"
        ".    wire  site  info";
      align-items: center;
      column-gap: 14px;
      row-gap: 10px;
      background: linear-gradient(100deg, #fff 35%, var(--card));
      padding: 16px 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(179, 18, 31, .06);
    }

    .link-row .node.ho {
      grid-area: ho;
    }

    .link-row .site-title {
      grid-area: title;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .site-title strong {
      color: var(--navy);
      font-size: .95rem;
    }

    .site-title small {
      color: var(--muted);
      font-size: .72rem;
    }

    .link-row .chevron {
      grid-area: chev;
      align-self: start;
      color: var(--muted);
      font-size: 1.4rem;
      line-height: 1;
      text-decoration: none;
    }

    .link-row .chevron:hover {
      color: var(--ho);
    }

    .link-row .wire {
      grid-area: wire;
    }

    .link-row .node.site {
      grid-area: site;
    }

    .link-row .info-btn {
      grid-area: info;
    }

    .link-row.syncing {
      --color: var(--syncing);
    }

    .link-row.disconnected {
      --color: var(--disconnected);
    }

    /* Nodes: HO and site */
    .node {
      flex: 0 0 auto;
      min-width: 70px;
      padding: 12px 14px;
      text-align: center;
      font-weight: 700;
      border-radius: 10px;
      letter-spacing: .5px;
    }

    .node.ho {
      background: var(--ho);
      color: #fff;
    }

    .node.site {
      padding: 8px 14px;
      border: 2px solid var(--color);
      color: var(--color);
      background: var(--card-solid);
    }

    .link-row.disconnected .node.site {
      border-style: dashed;
    }

    /* Running / Stopped flag */
    .flag-status {
      grid-area: flag;
      justify-self: center;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px 3px 6px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
      color: #16a34a;
      background: rgba(22, 163, 74, .1);
    }

    .flag-pole {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .flag-cloth {
      fill: currentColor;
      transform-origin: 5px 8px;
      animation: wave 1s ease-in-out infinite;
    }

    .link-row.disconnected .flag-status {
      color: var(--ho);
      background: rgba(179, 18, 31, .1);
    }

    .link-row.disconnected .flag-cloth {
      animation: none;
    }

    @keyframes wave {
      50% {
        transform: skewY(-8deg) scaleX(.9);
      }
    }

    /* Loaders: ECG on odd rows, particle dots on even rows */
    .wire {
      position: relative;
      height: 30px;
    }

    /* Particle dots: dots streaming HO -> site in a straight line */
    .wire.typing span {
      --y: 0px;
      position: absolute;
      top: calc(50% + var(--y));
      left: 0;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--color);
      transform: translate(-50%, -50%);
      opacity: 0;
      animation: stream 2.8s linear infinite;
      animation-delay: calc(var(--i) * -.2s);
    }

    .wire.typing span {
      width: 6px;
      height: 6px;
      background: #9ca3af;
    }

    .link-row.syncing .wire.typing span {
      animation-duration: 5.6s;
      animation-delay: calc(var(--i) * -.4s);
    }

    /* stopped: dots frozen in a flat grey row */
    .link-row.disconnected .wire.typing span {
      --y: 0px;
      left: calc(4% + var(--i) * 7%);
      opacity: .5;
      box-shadow: none;
      animation: none;
    }

    /* ECG heartbeat trace */
    .ecg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ecg path {
      fill: none;
      stroke: var(--color);
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .ecg-base {
      stroke-width: 1.5;
      opacity: .22;
    }

    .ecg-pulse {
      stroke-width: 2.4;
      stroke-dasharray: 22 100;
      stroke-dashoffset: 22;
      filter: drop-shadow(0 0 3px var(--color));
      animation: ecg-sweep 2.2s linear infinite;
    }

    .link-row.syncing .ecg-pulse {
      animation-duration: 4.4s;
    }

    .link-row:nth-child(2n) .ecg-pulse {
      animation-delay: -.8s;
    }

    .link-row.disconnected .ecg path {
      d: path("M0 15 H200");
    }

    .link-row.disconnected .ecg-base {
      opacity: .5;
      stroke-dasharray: 2 2;
    }

    .link-row.disconnected .ecg-pulse {
      display: none;
    }

    /* Info button */
    .info-btn {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
      color: var(--text);
      font: italic 700 15px Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: .2s;
    }

    .info-btn:hover {
      background: var(--ho);
      border-color: var(--ho);
      color: #fff;
    }

    @keyframes ecg-sweep {
      to {
        stroke-dashoffset: -100;
      }
    }

    @keyframes stream {
      0% {
        left: 0;
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      90% {
        opacity: 1;
      }

      100% {
        left: 100%;
        opacity: 0;
      }
    }

    /* Price settings page */
    .save-btn {
      margin-left: auto;
      align-self: center;
      padding: 10px 26px;
      border: 0;
      border-radius: 10px;
      background: var(--ho);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(179, 18, 31, .25);
    }

    .save-btn:hover:not(:disabled) {
      background: var(--ho-dark);
    }

    .save-btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    #settings-form {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .settings-card {
      background: var(--card-solid);
      border-radius: 14px;
      padding: 20px 22px;
      box-shadow: 0 4px 14px rgba(179, 18, 31, .06);
    }

    .settings-card h2 {
      margin: 0 0 16px;
      font-size: 1rem;
      color: var(--navy);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .card-head h2 {
      margin: 0;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px 20px;
      align-items: end;
    }

    .settings-grid label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: .8rem;
      font-weight: 600;
      color: var(--text);
    }

    .settings-grid input:not([type="checkbox"]),
    .sites-table input {
      height: 40px;
      padding: 0 12px;
      font: inherit;
      font-size: .9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      outline: none;
    }

    .settings-grid input:focus,
    .sites-table input:focus {
      border-color: var(--ho);
      box-shadow: 0 0 0 2px rgba(179, 18, 31, .12);
    }

    .settings-grid label.check {
      flex-direction: row;
      align-items: center;
      gap: 10px;
      height: 40px;
      font-size: .9rem;
      cursor: pointer;
    }

    .settings-grid label.check input {
      width: 18px;
      height: 18px;
      accent-color: var(--ho);
      cursor: pointer;
    }

    .sites-table input {
      width: 100%;
    }

    .sites-table td {
      padding: 8px 16px;
    }

    .sites-table th:last-child,
    .sites-table td:last-child {
      width: 60px;
      text-align: center;
    }

    .add-row-btn {
      padding: 8px 16px;
      border: 1px solid var(--ho);
      border-radius: 8px;
      background: #fff;
      color: var(--ho);
      font-weight: 700;
      cursor: pointer;
    }

    .add-row-btn:hover {
      background: var(--ho);
      color: #fff;
    }

    .remove-row-btn {
      width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: var(--ho);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
    }

    .remove-row-btn:hover {
      background: var(--ho);
      border-color: var(--ho);
      color: #fff;
    }

    .settings-msg {
      position: relative;
      z-index: 1;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 10px;
      font-size: .9rem;
    }

    .settings-msg[hidden] {
      display: none;
    }

    .settings-msg.ok {
      background: rgba(22, 163, 74, .1);
      color: #15803d;
    }

    .settings-msg.error {
      background: #fee2e2;
      color: #991b1b;
    }

    /* Site detail page */
    .detail {
      width: 100%;
      margin: 0;
      padding: 24px 32px 40px;
    }

    .back-link {
      color: var(--muted);
      text-decoration: none;
      font-size: .9rem;
    }

    .back-link:hover {
      color: var(--ho);
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin: 16px 0 24px;
    }

    .detail-head h1 {
      margin: 0;
      font-size: 1.8rem;
      color: var(--ho);
    }

    .site-meta {
      margin: 4px 0 0;
      color: var(--muted);
    }

    .live-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      border-radius: 999px;
      border: 2px solid var(--ho);
      background: var(--card-solid);
      color: var(--ho);
      font-weight: 700;
      letter-spacing: .5px;
      cursor: pointer;
      transition: .2s;
    }

    .live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--ho);
      transition: .2s;
    }

    .live-btn.on {
      border-color: #16a34a;
      background: #16a34a;
      color: #fff;
    }

    .live-btn.on .live-dot {
      background: #fff;
      animation: live-glow 1.4s infinite;
    }

    .table-wrap {
      background: var(--card-solid);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow-x: auto;
      box-shadow: 0 2px 8px rgba(179, 18, 31, .06);
    }

    .items-table {
      width: 100%;
      border-collapse: collapse;
    }

    .items-table th,
    .items-table td {
      padding: 10px 16px;
      text-align: left;
      white-space: nowrap;
    }

    .items-table th {
      background: var(--card);
      color: var(--ho-dark);
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
    }

    .items-table tbody tr+tr td {
      border-top: 1px solid var(--border);
    }

    .items-table td:first-child,
    .items-table th:first-child {
      width: 80px;
    }

    /* failed rows: whole row tinted red */
    .items-table tbody tr:has(.badge.failed) td {
      background: #fee2e2;
      color: #991b1b;
      border-top-color: #fecaca;
    }

    .items-table tbody tr:has(.badge.failed) td:first-child {
      box-shadow: inset 4px 0 0 var(--ho);
    }

    .items-table tbody tr:has(.badge.failed) .badge.failed {
      background: #fff;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
    }

    .badge.success {
      background: rgba(34, 197, 94, .15);
      color: #15803d;
    }

    .badge.failed {
      background: rgba(239, 68, 68, .15);
      color: #b91c1c;
    }

    .retry-btn {
      padding: 5px 14px;
      border: 0;
      border-radius: 6px;
      background: var(--ho);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }

    .retry-btn:hover:not(:disabled) {
      background: var(--ho-dark);
    }

    .retry-btn:disabled {
      background: #eee;
      color: var(--muted);
      cursor: default;
    }

    .pager {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
    }

    .pager[hidden] {
      display: none;
    }

    .pager button {
      min-width: 56px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-solid);
      color: var(--ho);
      font-weight: 600;
      cursor: pointer;
    }

    .pager button.active {
      background: var(--ho);
      border-color: var(--ho);
      color: #fff;
    }

    /* Retry confirmation popup */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(31, 41, 55, .45);
    }

    .modal-backdrop[hidden] {
      display: none;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      background: var(--card-solid);
      border-top: 4px solid var(--ho);
      border-radius: 12px;
      padding: 22px 24px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, .18);
      animation: pop .15s ease-out;
    }

    .modal-box h2 {
      margin: 0 0 10px;
      font-size: 1.15rem;
      color: var(--ho);
    }

    .modal-box p {
      margin: 0 0 22px;
      line-height: 1.5;
    }

    .modal-box strong {
      color: var(--ho-dark);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .modal-actions button {
      min-width: 84px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .modal-close {
      border: 1px solid var(--border);
      background: var(--card-solid);
      color: var(--text);
    }

    .modal-close:hover {
      background: #fff5f4;
    }

    .modal-ok {
      border: 1px solid var(--ho);
      background: var(--ho);
      color: #fff;
    }

    .modal-ok:hover {
      background: var(--ho-dark);
      border-color: var(--ho-dark);
    }

    @keyframes pop {
      from {
        transform: scale(.95);
        opacity: 0;
      }
    }

    @keyframes live-glow {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 255, 255, .8);
      }

      50% {
        box-shadow: 0 0 0 6px rgba(255, 255, 255, 0);
      }
    }

    @media (max-width: 520px) {
      .link-row {
        padding: 14px;
        gap: 8px;
      }

      .node {
        min-width: 52px;
        padding: 10px 8px;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="page-head">
      <div>
        <h1><span>PRICE</span> SETTINGS</h1>
        <p>Head office connection and site list</p>
      </div>
      <button type="button" class="save-btn" id="save-btn">Save</button>
    </header>

    <div class="settings-msg" id="settings-msg" hidden></div>

    <form id="settings-form" autocomplete="off">
      <section class="settings-card">
        <h2>Connection</h2>
        <div class="settings-grid">
          <label>HO URL
            <input type="url" name="ho_url" value="{{ settings.ho_url }}" placeholder="https://ho.example.com">
          </label>
          <label>Database Port
            <input type="number" name="db_port" value="{{ settings.db_port }}" min="1" max="65535" placeholder="1433">
          </label>
          <label>DB User
            <input type="text" name="db_user" value="{{ settings.db_user }}">
          </label>
          <label>DB Password
            <input type="password" name="db_password" value="{{ settings.db_password }}" autocomplete="new-password">
          </label>
          <label class="check">
            <input type="checkbox" name="is_central" {% if settings.is_central %}checked{% endif %}>
            Is Central
          </label>
        </div>
      </section>

      <section class="settings-card">
        <div class="card-head">
          <h2>Sites</h2>
          <button type="button" class="add-row-btn" id="add-row-btn">+ Add Row</button>
        </div>
        <div class="table-wrap">
          <table class="items-table sites-table">
            <thead>
              <tr>
                <th>Sl No</th>
                <th>Site Location</th>
                <th>Site IP</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="sites-body">
              {% for s in settings.sites %}
              <tr>
                <td class="sl"></td>
                <td><input type="text" class="site-location" value="{{ s.location }}"></td>
                <td><input type="text" class="site-ip" value="{{ s.ip }}" placeholder="10.0.0.1"></td>
                <td><button type="button" class="remove-row-btn" aria-label="Remove row">&times;</button></td>
              </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </section>
    </form>
  </div>

  <template id="site-row">
    <tr>
      <td class="sl"></td>
      <td><input type="text" class="site-location"></td>
      <td><input type="text" class="site-ip" placeholder="10.0.0.1"></td>
      <td><button type="button" class="remove-row-btn" aria-label="Remove row">&times;</button></td>
    </tr>
  </template>

  <script src="{{ url_for('static', filename='settings.js') }}"></script>
</body>

</html>
