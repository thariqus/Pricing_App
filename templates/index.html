<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{{ title or "Item Management" }}</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

* { box-sizing: border-box; }

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1e2130;
    background: #fff;
}

/* =========================
   LAYOUT
   ========================= */

.item-management-container {
    width: 100%;
    height: 100vh;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.top-bar {
    flex-shrink: 0;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
    padding: 18px 28px;
    margin-bottom: 14px;
}

.top-bar-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 20px;
    font-weight: 700;
    color: #4f46e5;
}

.top-bar-title i { font-size: 20px; }

.toolbar-form { width: 100%; display: block; }

.filters-row {
    width: 100%;
    display: grid;
    grid-template-columns: 300px 205px minmax(220px, 1fr) max-content;
    align-items: start;
    column-gap: 12px;
    row-gap: 6px;
}

/* =========================
   ITEM NO
   ========================= */

#itemNoContainer {
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.item-no-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 6px;
}

.item-no-row .itemNoInput {
    flex: 1 1 auto;
    min-width: 0;
    height: 42px;
    padding: 0 12px;
    font-size: 13px;
    border: 1px solid #dbe3ef;
    border-radius: 6px;
    outline: none;
}

.item-no-row .itemNoInput:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 2px rgba(79, 70, 229, .12);
}

.addItemNoBtn,
.removeItemNoBtn {
    width: 42px;
    min-width: 42px;
    height: 42px;
    padding: 0;
    font-size: 21px;
    line-height: 1;
    background: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 0;
}

.addItemNoBtn { border: 1px solid #9ca3af; color: #111827; }
.addItemNoBtn:hover { background: #eef2ff; color: #4f46e5; border-color: #4f46e5; }

.removeItemNoBtn { border: 1px solid #ef4444; color: #ef4444; }
.removeItemNoBtn:hover { background: #fef2f2; }

/* =========================
   CORE FIELDS
   ========================= */

.core-field { width: 205px; }

.core-field .form-control,
#fetchActive {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    font-size: 13px;
    background: #fff;
    border: 1px solid #dbe3ef;
    border-radius: 6px;
}

.core-field.filter-field { width: 100%; min-width: 220px; }

#addFilterSelect {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    font-size: 13px;
    font-weight: 600;
    color: #4f46e5;
    background: #fff;
    border: 1px solid #dbe3ef;
    border-radius: 6px;
    cursor: pointer;
}

/* =========================
   BUTTONS
   ========================= */

.toolbar-actions {
    grid-column: 4;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    width: max-content;
    flex-wrap: nowrap;
    white-space: nowrap;
}

.btn {
    height: 42px;
    padding: 0 13px;
    font-size: 13px;
    font-weight: 600;
    border-radius: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
}

.btn i { font-size: 13px; }

.btn-primary { background: #222; border: 1px solid #222; color: #fff; }
.btn-primary:hover { background: #000; border-color: #000; }

.btn-outline { background: #fff; border: 1px solid #dbe3ef; color: #1e293b; }
.btn-outline:hover { background: #f8fafc; border-color: #9ca3af; }

.btn-success { background: #10b981; border: 1px solid #10b981; color: #fff; }
.btn-success:hover { background: #059669; border-color: #059669; }

.btn-block { width: 100%; }

#saveUpdateBtn {
    background: #7acb91;
    border: 1px solid #7acb91;
    color: #fff;
    opacity: 1;
}

#saveUpdateBtn:hover:not(:disabled) { background: #5fb87a; border-color: #5fb87a; }
#saveUpdateBtn:disabled { cursor: not-allowed; opacity: .65; }

/* =========================
   FILTER CHIPS
   ========================= */

.active-filters {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
}

.filter-chip {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
}

.filter-chip label { margin: 0; font-size: 11px; font-weight: 700; color: #374151; }

.filter-chip input,
.filter-chip select {
    height: 34px;
    padding: 0 10px;
    font-size: 12px;
    background: #fff;
    border: 1px solid #cbd5e1;
    border-radius: 5px;
    outline: none;
}

.filter-chip input:focus,
.filter-chip select:focus { border-color: #64748b; }

.customer-hierarchy-filter { background: #fff; border-color: #d9dee7; padding: 4px 7px; }
.customer-filter-label { min-width: 78px; }
.customer-filter-type { width: 180px; }
.customer-filter-value { width: 210px; }

.customer-filter-remove,
.remove-filter {
    width: 34px;
    min-width: 34px;
    height: 34px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    line-height: 1;
    color: #dc2626;
    background: #fff;
    border: 1px solid #dc2626;
    border-radius: 5px;
    cursor: pointer;
}

.customer-filter-remove:hover,
.remove-filter:hover { color: #fff; background: #dc2626; }

/* =========================
   RESULTS
   ========================= */

.results-section {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    box-shadow: 0 1px 2px rgba(15, 23, 42, .06);
    overflow: hidden;
}

.table-responsive {
    flex: 1;
    min-height: 0;
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
    overflow-y: auto;
}

.table {
    width: 100%;
    max-width: 100%;
    margin: 0;
    table-layout: fixed;
    border-collapse: collapse;
    font-size: 9px;
}

.table th {
    position: sticky;
    top: 0;
    z-index: 5;
    background: #f8fafc;
    color: #1e2130;
    font-size: 9px;
    font-weight: 700;
    text-align: center;
    vertical-align: middle;
    padding: 6px 2px;
    border: 1px solid #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.table td {
    padding: 4px 2px;
    font-size: 9px;
    text-align: center;
    vertical-align: middle;
    border: 1px solid #e2e8f0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.table tbody tr:hover { background: #f8fafc; }

.table tbody input,
.table tbody select {
    width: 100%;
    min-width: 0;
    height: 30px;
    padding: 2px 3px;
    font-size: 9px;
    text-align: center;
    background: #fff;
    border: 1px solid #dbe3ef;
    border-radius: 5px;
}

.table tbody input:focus,
.table tbody select:focus { outline: none; border-color: #4f46e5; }

/* COLUMN WIDTHS — 19 data columns + action, total 100% */

.table th:nth-child(1),  .table td:nth-child(1)  { width: 4%;   }  /* Active */
.table th:nth-child(2),  .table td:nth-child(2)  { width: 5%;   }  /* Condition Type */
.table th:nth-child(3),  .table td:nth-child(3)  { width: 6%;   }  /* Item No */
.table th:nth-child(4),  .table td:nth-child(4)  { width: 5%;   }  /* Customer */
.table th:nth-child(5),  .table td:nth-child(5)  { width: 4%;   }  /* Customer Grp */
.table th:nth-child(6),  .table td:nth-child(6)  { width: 4%;   }  /* Customer Hierarchy */
.table th:nth-child(7),  .table td:nth-child(7)  { width: 4%;   }  /* Distribution Channel */
.table th:nth-child(8),  .table td:nth-child(8)  { width: 4%;   }  /* Location Code */
.table th:nth-child(9),  .table td:nth-child(9)  { width: 3.5%; }  /* Priority */
.table th:nth-child(10), .table td:nth-child(10) { width: 4%;   }  /* Currency */
.table th:nth-child(11), .table td:nth-child(11) { width: 6%;   }  /* Sales Price */
.table th:nth-child(12), .table td:nth-child(12) { width: 4%;   }  /* UOM */
.table th:nth-child(13), .table td:nth-child(13) { width: 4%;   }  /* Min Qty */
.table th:nth-child(14), .table td:nth-child(14) { width: 8%;   }  /* Starting Date */
.table th:nth-child(15), .table td:nth-child(15) { width: 8%;   }  /* Ending Date */
.table th:nth-child(16), .table td:nth-child(16) { width: 5%;   }  /* Lower Limit */
.table th:nth-child(17), .table td:nth-child(17) { width: 5%;   }  /* Upper Limit */
.table th:nth-child(18), .table td:nth-child(18) { width: 4%;   }  /* Zone Code */
.table th:nth-child(19), .table td:nth-child(19) { width: 4%;   }  /* Offer Article */
.table th:nth-child(20), .table td:nth-child(20) { width: 8.5%; }  /* Action */

.table td.col-starting_date,
.table td.col-ending_date { font-size: 8px; letter-spacing: -.2px; }

/* EDITABLE CELLS */

.table td.editable-cell { cursor: pointer; }
.table td.editable-cell:hover { background: #eef2ff; }
.table tr.row-dirty { background: #fffbeb !important; }
.table td.cell-dirty { background: #fef3c7; font-weight: 600; }

/* ACTIVE TICK */

.active-tick-btn {
    width: 32px;
    height: 30px;
    min-width: 32px;
    padding: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #222;
    border-radius: 5px;
    background: #222;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
}

.active-tick-btn:hover { background: #000; border-color: #000; }
.active-tick-btn.inactive { background: #fff; border-color: #dbe3ef; color: transparent; }

/* ACTION COLUMN */

.fixed-action-column,
.table tbody td:last-child {
    position: sticky;
    right: 0;
    z-index: 4;
    background: #fff;
}

.fixed-action-column { z-index: 6; background: #f8fafc; }
.table tbody tr:hover td:last-child { background: #f8fafc; }

.delete-row-btn {
    width: 34px;
    height: 30px;
    border: none;
    border-radius: 6px;
    background: #ef4444;
    color: #fff;
    font-size: 11px;
    cursor: pointer;
}

.delete-row-btn:hover { background: #dc2626; }

/* =========================
   PAGINATION
   ========================= */

.pagination-controls {
    flex-shrink: 0;
    min-height: 42px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-top: 1px solid #e2e8f0;
    font-size: 12px;
}

.pagination-controls button {
    padding: 6px 12px;
    border: 1px solid #dbe3ef;
    border-radius: 6px;
    background: #fff;
    color: #4f46e5;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
}

.pagination-controls button:hover:not(:disabled) {
    background: #4f46e5;
    border-color: #4f46e5;
    color: #fff;
}

.pagination-controls button:disabled { opacity: .45; cursor: not-allowed; }

/* =========================
   MODAL
   ========================= */

.modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1050;
    overflow: auto;
    background: rgba(15, 23, 42, .55);
}

.modal-dialog { width: auto; max-width: 480px; margin: 60px auto; }

.modal-content {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(15, 23, 42, .12);
    overflow: hidden;
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    background: #f8fafc;
    border-bottom: 1px solid #e2e8f0;
}

.modal-title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
    font-size: 1.05rem;
    font-weight: 700;
}

.modal-title i { color: #4f46e5; }

.close {
    background: transparent;
    border: none;
    font-size: 1.3rem;
    color: #64748b;
    cursor: pointer;
}

.modal-body { padding: 22px; }
.modal-body .form-group { margin-bottom: 14px; }

.modal-body label {
    display: block;
    margin-bottom: 6px;
    font-size: .85rem;
    font-weight: 600;
}

.modal-body .form-control {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 14px 22px;
    background: #f8fafc;
    border-top: 1px solid #e2e8f0;
}

/* =========================
   CSV LOADING
   ========================= */

.csv-loading-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(255, 255, 255, .8);
    align-items: center;
    justify-content: center;
}

.csv-loading-box {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 5px 25px rgba(0, 0, 0, .15);
    text-align: center;
}

.csv-spinner {
    width: 35px;
    height: 35px;
    margin: 0 auto 15px;
    border: 4px solid #e5e7eb;
    border-top-color: #4f46e5;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.csv-loading-title { font-size: 17px; font-weight: 700; margin-bottom: 5px; }
.csv-loading-text { font-size: 12px; color: #64748b; }

/* =========================
   RESPONSIVE
   ========================= */

@media (max-width: 1200px) and (min-width: 901px) {

    .filters-row {
        grid-template-columns: 270px 190px minmax(180px, 1fr) max-content;
        column-gap: 8px;
    }

    #itemNoContainer { width: 270px; }
    .core-field { width: 190px; }
    .toolbar-actions { gap: 5px; }
    .toolbar-actions .btn { padding: 0 9px; font-size: 12px; }
}

@media (max-width: 900px) {

    .filters-row { display: flex; flex-direction: column; gap: 8px; }

    #itemNoContainer,
    .core-field,
    .core-field.filter-field { width: 100%; min-width: 100%; }

    .toolbar-actions { width: 100%; flex-wrap: wrap; justify-content: flex-start; }
    .toolbar-actions .btn { flex: 1 1 auto; }
    .table-responsive { max-height: 60vh; }
}

</style>

</head>


<body>

<div class="item-management-container">

    <!-- =====================================================
         HEADER + TOOLBAR
         ===================================================== -->

    <div class="top-bar">

        <div class="top-bar-title">

            <span style="display:flex; align-items:center; gap:10px;">
                <i class="fas fa-tags"></i>
                Item Management
            </span>

        </div>


        <form id="fetchForm" class="toolbar-form">

            <div class="filters-row">

                <!-- ITEM NO -->

                <div id="itemNoContainer">

                    <div class="item-no-row">

                        <input type="text"
                               class="form-control itemNoInput"
                               name="item_no[]"
                               placeholder="Item No"
                               autocomplete="off">

                        <button type="button"
                                class="addItemNoBtn"
                                title="Add Item No">+</button>

                    </div>

                </div>


                <!-- ACTIVE -->

                <div class="core-field">

                    <select id="fetchActive" name="active" class="form-control">
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                        <option value="">All</option>
                    </select>

                </div>


                <!-- ADD FILTER -->

                <div class="core-field filter-field">

                    <select id="addFilterSelect" class="form-control">
                        <option value="">+ Add filter</option>
                        <option value="customer_group_hierarchy">Customer / Group / Hierarchy</option>
                        <option value="sort_by">Sort By</option>
                        <option value="sales_organization">Sales Organization</option>
                        <option value="distribution_channel">Distribution Channel</option>
                        <option value="location_code">Location Code</option>
                        <option value="condition_type">Condition Type</option>
                        <option value="sales_price">Sales Price</option>
                        <option value="currency">Currency</option>
                        <option value="uom">Unit of Measure</option>
                        <option value="min_qty">Minimum Quantity</option>
                        <option value="lower_limit">Lower Limit</option>
                        <option value="upper_limit">Upper Limit</option>
                        <option value="zone_code">Transportation Zone</option>
                        <option value="starting_date">Starting Date</option>
                        <option value="ending_date">Ending Date</option>
                        <option value="priority">Priority</option>
                        <option value="offer_article">Offer Article</option>
                    </select>

                </div>


                <!-- ACTIONS -->

                <div class="toolbar-actions">

                    <button type="submit" id="fetch" class="btn btn-primary">
                        <i class="fas fa-search"></i> Fetch
                    </button>

                    <button type="button" id="downloadCsvBtn" class="btn btn-outline">
                        <i class="fas fa-download"></i> CSV
                    </button>

                    <button type="button" id="importBtnUnique" class="btn btn-outline">
                        <i class="fas fa-file-import"></i> Import
                    </button>

                    <button type="button" id="addItemBtn" class="btn btn-success">
                        <i class="fas fa-plus"></i> Add Item
                    </button>

                    <button type="button" id="saveUpdateBtn" class="btn" disabled>
                        Save
                    </button>

                </div>

            </div>


            <div id="activeFilters" class="active-filters"></div>

        </form>

    </div>


    <!-- =====================================================
         CSV POPUP
         ===================================================== -->

    <div id="csvPopUp" class="modal" tabindex="-1">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        <i class="fas fa-file-upload"></i> Upload Data
                    </h5>

                    <button type="button" class="close" id="closeCsvPopup">
                        <span>&times;</span>
                    </button>

                </div>

                <div class="modal-body">

                    <div class="form-group">
                        <label>Select Action</label>
                        <select id="actionSelect" class="form-control">
                            <option value="add">Add Data</option>
                            <option value="update">Update Data</option>
                            <option value="bulk">Bulk Reset</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <button type="button" id="downloadSampleBtn" class="btn btn-outline btn-block">
                            <i class="fas fa-file-csv"></i> Download Sample CSV
                        </button>
                    </div>

                    <div class="form-group">
                        <label>Upload CSV File</label>
                        <input type="file" id="fileUpload" class="form-control" accept=".csv">
                    </div>

                </div>

                <div class="modal-footer">

                    <button type="button" id="cancelCsvBtn" class="btn btn-outline">Cancel</button>

                    <button type="button" id="uploadBtn" class="btn btn-primary">
                        <i class="fas fa-upload"></i> Upload CSV
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         LOADING OVERLAY
         ===================================================== -->

    <div id="csvLoadingOverlay" class="csv-loading-overlay">

        <div class="csv-loading-box">

            <div class="csv-spinner"></div>

            <div class="csv-loading-title">Processing CSV...</div>

            <div class="csv-loading-text">
                Please wait while the CSV data is being uploaded and processed.
            </div>

        </div>

    </div>


    <!-- =====================================================
         RESULTS
         ===================================================== -->

    <div class="results-section">

        <div class="table-responsive">

            <table class="table table-bordered table-hover">

                <thead>
                    <tr id="itemPriceTableHead"></tr>
                </thead>

                <tbody id="itemPriceTableBody"></tbody>

            </table>

        </div>

        <div id="paginationControls" class="pagination-controls"></div>

    </div>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

/* =========================================================
   COLUMN DEFINITIONS

   Single source of truth. The header, the fetched rows, the
   Add Item row, the editors, the CSV export and the save
   payload are all generated from this array — so adding or
   removing a column here is the only change needed.

   type:     text | number | datetime
   editable: inline-editable on an existing (fetched) row
   ========================================================= */

const COLUMNS = [
    { key: "active",                    label: "Active",               type: "active"                    },
    { key: "condition_type",            label: "Condition Type",       type: "text"                      },
    { key: "item_no",                   label: "Item No",              type: "text"                      },
    { key: "customer",                  label: "Customer",             type: "text"                      },
    { key: "customer_grp",              label: "Customer Grp",         type: "text"                      },
    { key: "customer_hierarchy",        label: "Customer Hierarchy",   type: "text"                      },
    { key: "distribution_channel_code", label: "Distribution Channel", type: "text"                      },
    { key: "location_code",             label: "Location Code",        type: "text"                      },
    { key: "priority",                  label: "Priority",             type: "number",   editable: true  },
    { key: "currency",                  label: "Currency",             type: "text"                      },
    { key: "sales_price",               label: "Sales Price",          type: "number",   editable: true  },
    { key: "uom",                       label: "UOM",                  type: "text"                      },
    { key: "minimum_quantity",          label: "Min Qty",              type: "number",   editable: true  },
    { key: "starting_date",             label: "Starting Date",        type: "datetime", editable: true  },
    { key: "ending_date",               label: "Ending Date",          type: "datetime", editable: true  },

/* =========================================================
   JS FIELD  ->  MySQL COLUMN

   The table columns don't all match the UI field names,
   so every payload is translated through this map before
   it leaves the browser.
   ========================================================= */

const DB_COLUMNS = {
    active:               "active",
    condition_type:       "condition_type",
    item_no:              "item_no",
    customer:             "customer",
    customer_grp:         "customer_grp",
    customer_hierarchy:   "customer_hierarchy",
    distribution_channel: "distribution_channel_code",
    location_code:        "location_code",
    priority:             "priority",
    currency:             "currency",
    sales_price:          "sales_price",
    uom:                  "uom",
    min_qty:              "minimum_quantity",
    starting_date:        "starting_date",
    ending_date:          "ending_date",
    lower_limit:          "lower_limit",
    upper_limit:          "upper_limit",
    zone_code:            "transportation_zone_code",
    offer_article:        "offer_article"
};

// COLUMNS keys are already DB column names, so a key that is
// itself a DB column must pass through untouched.
const DB_COLUMN_NAMES = new Set(Object.values(DB_COLUMNS));

/* Columns MySQL declares as INT / FLOAT — an empty string is
   rejected for these, so blanks are sent as null instead. */
const NUMERIC_COLUMNS = new Set([
    "customer_grp",
    "customer_hierarchy",
    "distribution_channel_code",
    "location_code",
    "priority",
    "sales_price",
    "minimum_quantity",
    "lower_limit",
    "upper_limit"
]);

/* Columns MySQL declares as BOOLEAN / TINYINT(1) */
const BOOLEAN_COLUMNS = new Set([
    "active",
    "offer_article",
    "updated_from_sap"
]);

/* Columns MySQL declares as DATE / DATETIME */
const DATE_COLUMNS = new Set(["starting_date", "ending_date"]);


function toDbPayload(data) {

    const payload = {};

    Object.keys(data).forEach(function (key) {

        if (key === "id") {
            payload.id = data[key];
            return;
        }

        // UI name -> DB name, or already a DB name -> keep as is
        const column = DB_COLUMNS[key] || (DB_COLUMN_NAMES.has(key) ? key : null);

        if (!column) {
            return;
        }

        if (BOOLEAN_COLUMNS.has(column)) {

            let value = data[key];

            if (typeof value === "string") {
                value = value.trim().toLowerCase();
            }

            if (value === "" || value === null || value === undefined) {
                payload[column] = 0;
                return;
            }

            payload[column] =
                (value === true || value === "true" || value === "1" || value === 1)
                    ? 1 : 0;

            return;
        }

        let value = data[key];

        if (typeof value === "string") {
            value = value.trim();
        }

        // Blank -> NULL for anything MySQL types as a number or date
        if (
            value === "" &&
            (NUMERIC_COLUMNS.has(column) || DATE_COLUMNS.has(column))
        ) {
            payload[column] = null;
            return;
        }

        if (value !== "" && NUMERIC_COLUMNS.has(column)) {
            const number = Number(value);
            payload[column] = isNaN(number) ? null : number;
            return;
        }

        payload[column] = value;
    });

    return payload;
}

/* =========================================================
   HELPERS
   ========================================================= */

function rowId(item) {
    // Prefer the DB primary key; fall back to the legacy keys
    // so rows still work if the API hasn't been updated yet.
    return item.id ?? item.condition_id ?? item.unique_key ?? null;
}

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
}

function toBackendDateTime(value) {

    if (!value) {
        return "";
    }

    let text = String(value).trim().replace("T", " ");

    // 2026-08-21 23:59  ->  2026-08-21 23:59:00
    if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(text)) {
        text += ":00";
    }

    return text;
}

// CSV wants US-style dates; the table holds YYYY-MM-DD HH:MM:SS
function csvDate(value) {

    if (!value) {
        return "";
    }

    const parsed = new Date(String(value).replace(" ", "T"));

    if (isNaN(parsed)) {
        return value;
    }

    return String(parsed.getMonth() + 1).padStart(2, "0") + "/" +
           String(parsed.getDate()).padStart(2, "0") + "/" +
           parsed.getFullYear();
}

function toInputDateTime(value) {

    // Backend sends "2026-08-21 23:59:59"; datetime-local needs a T.
    return String(value ?? "").trim().replace(" ", "T");
}

function nowForInput() {

    const now = new Date(Date.now() - new Date().getTimezoneOffset() * 60000);
    return now.toISOString().slice(0, 19);
}

function endOfTodayForInput() {

    const now = new Date();

    return now.getFullYear() + "-" +
        String(now.getMonth() + 1).padStart(2, "0") + "-" +
        String(now.getDate()).padStart(2, "0") + "T23:59:59";
}


/* =========================================================
   VALIDATION

   Mirrors the original priority matrix. Sales Organization
   isn't a table column here, so its value is read from the
   "Sales Organization" filter chip when that rule applies.
   ========================================================= */

const PRIORITY_CONFIG = [
    ["distribution_channel", "customer",         "location_code", "item_no", "uom"],
    ["distribution_channel", "customer_grp",     "location_code", "item_no", "uom"],
    ["distribution_channel", "customer",         "item_no", "uom"],
    ["distribution_channel", "customer_grp",     "item_no", "uom"],
    ["customer_grp",         "item_no",          "uom"],
    ["customer_hierarchy",   "location_code",    "item_no", "uom"],
    ["customer_hierarchy",   "item_no",          "uom"],
    ["distribution_channel", "location_code",    "item_no", "zone_code", "uom"],
    ["distribution_channel", "location_code",    "item_no", "uom"],
    ["distribution_channel", "item_no",          "uom"],
    ["item_no",              "uom"]
];

const FIELD_LABELS = {
    sales_organization:   "Sales Organization",
    distribution_channel: "Distribution Channel",
    customer:             "Customer No",
    customer_grp:         "Customer Group",
    customer_hierarchy:   "Customer Hierarchy",
    location_code:        "Location Code",
    item_no:              "Item No",
    uom:                  "Unit of Measure",
    zone_code:            "Transportation Zone Code",
    condition_type:       "Condition Type",
    sales_price:          "Sales Price",
    starting_date:        "Starting Date",
    ending_date:          "Ending Date",
    lower_limit:          "Lower Limit",
    upper_limit:          "Upper Limit",
    priority:             "Priority",
    currency:             "Currency"
};

const REQUIRED_FIELDS = [
    "condition_type",
    "sales_price",
    "starting_date",
    "ending_date",
    "lower_limit",
    "upper_limit",
    "priority",
    "currency"
];

const FREE_FIELDS = new Set([
    "min_qty",
    "offer_article",
    "active",
    "id",
    "sales_organization"
]);



function validateItem(data, mode) {

    const errors   = [];
    const isUpdate = mode === "update";

    const lower = data.lower_limit !== undefined && data.lower_limit !== ""
        ? Number(data.lower_limit) : undefined;

    const upper = data.upper_limit !== undefined && data.upper_limit !== ""
        ? Number(data.upper_limit) : undefined;

    const sales = data.sales_price !== undefined && data.sales_price !== ""
        ? Number(data.sales_price) : undefined;


    /* ---- numeric ---- */

    ["sales_price", "lower_limit", "upper_limit", "min_qty", "priority"].forEach(function (field) {

        if (
            data[field] !== undefined &&
            data[field] !== "" &&
            isNaN(Number(data[field]))
        ) {
            errors.push((FIELD_LABELS[field] || field) + " must be a number");
        }
    });


    /* ---- positive values ---- */

    if (lower !== undefined && !isNaN(lower) && lower <= 0) {
        errors.push("Lower Limit must be greater than 0");
    }

    if (upper !== undefined && !isNaN(upper) && upper <= 0) {
        errors.push("Upper Limit must be greater than 0");
    }

    if (sales !== undefined && !isNaN(sales) && sales <= 0) {
        errors.push("Sales Price must be greater than 0");
    }


    /* ---- relations ---- */

    if (lower !== undefined && upper !== undefined && !isNaN(lower) && !isNaN(upper) && lower > upper) {
        errors.push("Lower Limit cannot be greater than Upper Limit");
    }

    if (sales !== undefined && lower !== undefined && !isNaN(sales) && !isNaN(lower) && sales < lower) {
        errors.push("Sales Price cannot be less than Lower Limit");
    }

    if (sales !== undefined && upper !== undefined && !isNaN(sales) && !isNaN(upper) && sales > upper) {
        errors.push("Sales Price cannot be greater than Upper Limit");
    }


    /* ---- dates ---- */

    const dateRegex = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/;

    ["starting_date", "ending_date"].forEach(function (field) {

        if (data[field]) {

            data[field] = toBackendDateTime(data[field]);

            if (!dateRegex.test(data[field])) {
                errors.push((FIELD_LABELS[field] || field) + " must be YYYY-MM-DD HH:mm:ss");
            }
        }
    });

    if (
        data.starting_date &&
        data.ending_date &&
        dateRegex.test(data.starting_date) &&
        dateRegex.test(data.ending_date) &&
        data.starting_date > data.ending_date
    ) {
        errors.push("Starting Date cannot be after Ending Date");
    }


    /* ---- priority ---- */

    const hasPriority =
        data.priority !== undefined &&
        data.priority !== null &&
        data.priority !== "";

    const priority = hasPriority ? Number(data.priority) : null;

    if (isUpdate) {

        // On update, only check priority when it's being changed.
        if (hasPriority && (isNaN(priority) || priority < 1 || priority > PRIORITY_CONFIG.length)) {

            errors.push(
                "Invalid priority value: " + data.priority +
                ". Valid values are 1 to " + PRIORITY_CONFIG.length
            );
        }

    } else {

        REQUIRED_FIELDS.forEach(function (field) {

            if (
                data[field] === undefined ||
                data[field] === null ||
                String(data[field]).trim() === ""
            ) {
                errors.push((FIELD_LABELS[field] || field) + " is required");
            }
        });

        if (!hasPriority || isNaN(priority)) {

            errors.push("Priority is required");

        } else if (priority < 1 || priority > PRIORITY_CONFIG.length) {

            errors.push(
                "Invalid priority value: " + data.priority +
                ". Valid values are 1 to " + PRIORITY_CONFIG.length
            );

        } else {

            const mandatory = PRIORITY_CONFIG[priority - 1];

            mandatory.forEach(function (field) {

                if (
                    data[field] === undefined ||
                    data[field] === null ||
                    String(data[field]).trim() === ""
                ) {

                    errors.push(
                        (FIELD_LABELS[field] || field) +
                        " is required for priority " + priority
                    );
                }
            });


            // Fields that must stay empty for this priority
            Object.keys(data).forEach(function (field) {

                if (
                    REQUIRED_FIELDS.indexOf(field) === -1 &&
                    mandatory.indexOf(field) === -1 &&
                    !FREE_FIELDS.has(field) &&
                    data[field] !== undefined &&
                    data[field] !== null &&
                    String(data[field]).trim() !== ""
                ) {

                    errors.push(
                        "'" + (FIELD_LABELS[field] || field) +
                        "' must be empty for priority " + priority
                    );
                }
            });
        }
    }


    if (errors.length > 0) {
        alert("Validation failed:\n\n" + errors.join("\n"));
        return false;
    }

    return true;
}

function hasPendingNewRows() {

        const input = row.querySelector('[data-field="item_no"]');
        return input && input.value.trim() !== "";

}

function refreshSaveButtonState() {

    saveButton.disabled = pendingUpdates.size === 0 && !hasPendingNewRows();
}


/* =========================================================
   RENDER FETCHED ROWS
   ========================================================= */

function displayValue(item, column) {

    const pending = pendingUpdates.get(rowId(item));

    if (pending && Object.prototype.hasOwnProperty.call(pending, column.key)) {
        return pending[column.key];
    }

    return item[column.key];
}

function renderTable() {

    tableBody.innerHTML = "";

    if (items.length === 0) {

        tableBody.innerHTML =
            '<tr><td colspan="' + (COLUMNS.length + 1) + '"' +
            ' style="text-align:center; padding:20px; color:#777;">' +
            "No items found</td></tr>";

        return;
    }

    items.forEach(function (item) {

        const id      = rowId(item);
        const pending = pendingUpdates.get(id);
        const row     = document.createElement("tr");

        row.dataset.id = id === null ? "" : id;

        if (pending) {
            row.classList.add("row-dirty");
        }

        let html = "";

        COLUMNS.forEach(function (column) {

            const value   = displayValue(item, column);
            const changed = pending &&
                Object.prototype.hasOwnProperty.call(pending, column.key);

            if (column.type === "active") {

                const isActive = value === true || value === "true" || value === 1;

                html +=
                    '<td class="col-active">' +
                        '<button type="button" class="active-tick-btn' +
                        (isActive ? "" : " inactive") + '" title="Toggle active">' +
                        (isActive ? "\u2713" : "") +
                        "</button>" +
                    "</td>";

                return;
            }

            html +=
                '<td class="col-' + column.key +
                (column.editable ? " editable-cell" : "") +
                (changed ? " cell-dirty" : "") +
                '" data-field="' + column.key + '">' +
                escapeHtml(value ?? "") +
                "</td>";
        });

        html +=
            "<td>" +
                '<button type="button" class="delete-row-btn delete-row" title="Delete">' +
                    '<i class="fas fa-trash"></i>' +
                "</button>" +
            "</td>";

        row.innerHTML = html;

        tableBody.appendChild(row);
    });
}

function renderPagination() {

    totalPages = Math.max(1, Math.ceil(totalRows / PAGE_SIZE));

    if (items.length === 0) {
        pagination.innerHTML = "";
        return;
    }

    pagination.innerHTML =
        '<button type="button" id="prevPage"' +
        (currentPage === 1 ? " disabled" : "") + ">Previous</button>" +
        "<span>Page " + currentPage + " / " + totalPages +
        " &nbsp;·&nbsp; " + totalRows.toLocaleString() + " rows</span>" +
        '<button type="button" id="nextPage"' +
        (currentPage >= totalPages ? " disabled" : "") + ">Next</button>";

    const prev = document.getElementById("prevPage");
    const next = document.getElementById("nextPage");

    if (prev) {
        prev.addEventListener("click", function () {
            if (currentPage > 1 && discardPendingOrConfirm()) {
                fetchAndPopulate(currentPage - 1);
            }
        });
    }

    if (next) {
        next.addEventListener("click", function () {
            if (currentPage < totalPages && discardPendingOrConfirm()) {
                fetchAndPopulate(currentPage + 1);
            }
        });
    }
}


/* =========================================================
   INLINE CELL EDITING
   ========================================================= */

function recordChange(row, field, value) {

    const id = row.dataset.id;

    if (!id) {
        alert("This row has no id, so the change can't be saved.");
        return false;
    }

    const entry = pendingUpdates.get(id) || { id: id };

    entry[field] = value;

    pendingUpdates.set(id, entry);

    row.classList.add("row-dirty");

    refreshSaveButtonState();

    return true;
}

function cellValue(row, field) {

    const cell = row.querySelector('[data-field="' + field + '"]');
    return cell ? cell.innerText.trim() : "";
}

function makeCellEditable(cell) {

    if (cell.querySelector("input")) {
        return;
    }

    const row    = cell.parentNode;
    const field  = cell.dataset.field;
    const column = COLUMNS.find(function (c) { return c.key === field; });

    if (!column || !column.editable) {
        return;
    }

    const oldValue = cell.innerText.trim();
    const input    = document.createElement("input");

    if (column.type === "number") {

        input.type = "number";
        input.step = "any";
        input.value = oldValue;

    } else if (column.type === "datetime") {

        input.type  = "datetime-local";
        input.step  = "1";
        input.value = toInputDateTime(oldValue);

    } else {

        input.type  = "text";
        input.value = oldValue;
    }

    let finished = false;

    function commit() {

        if (finished) {
            return;
        }

        finished = true;

        let newValue = input.value;

        if (column.type === "datetime") {
            newValue = toBackendDateTime(newValue);
        }

        newValue = String(newValue).trim();

        cell.innerText = newValue;

        if (newValue === oldValue) {
            return;
        }

        // Validate the change against the row's other values
        const candidate = {
            priority:      field === "priority"      ? newValue : cellValue(row, "priority"),
            sales_price:   field === "sales_price"   ? newValue : cellValue(row, "sales_price"),
            lower_limit:   field === "lower_limit"   ? newValue : cellValue(row, "lower_limit"),
            upper_limit:   field === "upper_limit"   ? newValue : cellValue(row, "upper_limit"),
            min_qty:       field === "min_qty"       ? newValue : cellValue(row, "min_qty"),
            starting_date: field === "starting_date" ? newValue : cellValue(row, "starting_date"),
            ending_date:   field === "ending_date"   ? newValue : cellValue(row, "ending_date")
        };

        if (!validateItem(candidate, "update")) {
            cell.innerText = oldValue;
            return;
        }

        if (!recordChange(row, field, newValue)) {
            cell.innerText = oldValue;
            return;
        }

        cell.classList.add("cell-dirty");
    }

    input.addEventListener("blur", commit);

    input.addEventListener("keydown", function (event) {

        if (event.key === "Enter") {
            event.preventDefault();
            input.blur();
        }

        if (event.key === "Escape") {
            finished = true;
            cell.innerText = oldValue;
        }
    });

    cell.innerText = "";
    cell.appendChild(input);
    input.focus();
}


/* =========================================================
   ADD ITEM ROW
   ========================================================= */

function createNewRow() {

    const row = document.createElement("tr");

    row.className = "new-item-row";

    let html = "";

    COLUMNS.forEach(function (column) {

        if (column.type === "active") {

            html +=
                "<td>" +
                    '<button type="button" class="active-tick-btn" title="Toggle active">\u2713</button>' +
                    '<input type="hidden" data-field="active" value="true">' +
                "</td>";

            return;
        }

        if (column.type === "datetime") {

            const value = column.key === "starting_date"
                ? nowForInput()
                : endOfTodayForInput();

            html +=
                "<td>" +
                    '<input type="datetime-local" step="1" data-field="' +
                    column.key + '" value="' + value + '">' +
                "</td>";

            return;
        }

        const defaults = { condition_type: "ZEN1", currency: "AED" };

        html +=
            "<td>" +
                '<input type="' + (column.type === "number" ? "number" : "text") + '"' +
                (column.type === "number" ? ' step="any"' : "") +
                ' data-field="' + column.key + '"' +
                ' placeholder="' + escapeHtml(column.label) + '"' +
                ' value="' + (defaults[column.key] || "") + '"' +
                ' autocomplete="off">' +
            "</td>";
    });

    html +=
        "<td>" +
            '<button type="button" class="delete-row-btn delete-row" title="Remove row">' +
                '<i class="fas fa-trash"></i>' +
            "</button>" +
        "</td>";

    row.innerHTML = html;

    tableBody.prepend(row);

    const itemInput = row.querySelector('[data-field="item_no"]');

    if (itemInput) {
        itemInput.focus();
    }

    refreshSaveButtonState();

    return row;
}

function readNewRow(row) {

    const data = {};

    COLUMNS.forEach(function (column) {

        const input = row.querySelector('[data-field="' + column.key + '"]');

        if (!input) {
            data[column.key] = "";
            return;
        }

        if (column.type === "active") {
            data.active = input.value === "true";
            return;
        }

        let value = (input.value ?? "").toString().trim();

        if (column.type === "datetime") {
            value = toBackendDateTime(value);
        }

        data[column.key] = value;
    });

    return data;
}

function collectNewRows() {

    return Array.from(tableBody.querySelectorAll(".new-item-row"))
        .map(function (row) {
            return { row: row, data: readNewRow(row) };
        })
        .filter(function (entry) {
            return entry.data.item_no !== "";
        });
}


/* =========================================================
   TABLE EVENT DELEGATION
   ========================================================= */

tableBody.addEventListener("click", function (event) {

    /* ---- active toggle ---- */

    const tick = event.target.closest(".active-tick-btn");

    if (tick) {

        const isActive = !tick.classList.contains("inactive");
        const row      = tick.closest("tr");

        tick.classList.toggle("inactive", isActive);
        tick.textContent = isActive ? "" : "\u2713";

        if (row.classList.contains("new-item-row")) {

            const hidden = row.querySelector('[data-field="active"]');

            if (hidden) {
                hidden.value = isActive ? "false" : "true";
            }

            refreshSaveButtonState();
            return;
        }

        const nowActive = !isActive;

        recordChange(row, "active", nowActive);

        // Deactivating stamps the ending date with "now",
        // matching the original behaviour.
        if (!nowActive) {

            const now = new Date();

            const stamp =
                now.getFullYear() + "-" +
                String(now.getMonth() + 1).padStart(2, "0") + "-" +
                String(now.getDate()).padStart(2, "0") + " " +
                String(now.getHours()).padStart(2, "0") + ":" +
                String(now.getMinutes()).padStart(2, "0") + ":" +
                String(now.getSeconds()).padStart(2, "0");

            const endCell = row.querySelector('[data-field="ending_date"]');

            if (endCell) {
                endCell.innerText = stamp;
                endCell.classList.add("cell-dirty");
            }

            recordChange(row, "ending_date", stamp);
        }

        return;
    }


    /* ---- delete ---- */

    const deleteButton = event.target.closest(".delete-row");

    if (deleteButton) {

        const row = deleteButton.closest("tr");

        if (row.classList.contains("new-item-row")) {
            row.remove();
            refreshSaveButtonState();
            return;
        }

        const id = row.dataset.id;

        if (!id) {
            alert("This row has no id, so it can't be deleted.");
            return;
        }

        if (!confirm("Delete this item condition? This cannot be undone.")) {
            return;
        }

        deleteButton.disabled = true;

        fetch(API.remove, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: id })
        })
        .then(function (response) {

            return response.json().then(function (result) {

                if (!response.ok) {
                    throw new Error(result.error || "Delete failed");
                }

                return result;
            });
        })
        .then(function () {

            items = items.filter(function (item) {
                return String(rowId(item)) !== String(id);
            });

            pendingUpdates.delete(id);

            renderTable();
            renderPagination();
            refreshSaveButtonState();
        })
        .catch(function (error) {

            console.error("Delete error:", error);
            alert("Unable to delete item: " + error.message);
            deleteButton.disabled = false;
        });

        return;
    }


    /* ---- inline edit ---- */

    const cell = event.target.closest("td.editable-cell");

    if (cell) {
        makeCellEditable(cell);
    }
});

/* =========================================================
   FILTER CHIPS
   ========================================================= */

const addFilterSelect = document.getElementById("addFilterSelect");
const activeFilters   = document.getElementById("activeFilters");

const DATE_FILTERS   = ["starting_date", "ending_date"];
const NUMBER_FILTERS = ["sales_price", "min_qty", "lower_limit", "upper_limit", "priority"];

addFilterSelect.addEventListener("change", function () {

    const value = this.value;

    this.value = "";

    if (!value || document.getElementById("filter-" + value)) {
        return;
    }

    const chip = document.createElement("div");

    chip.id = "filter-" + value;


    /* ---- customer / group / hierarchy ---- */

    if (value === "customer_group_hierarchy") {

        chip.className = "filter-chip customer-hierarchy-filter";

        chip.innerHTML =
            '<label class="customer-filter-label">CUSTOMER</label>' +
            '<select class="customer-filter-type">' +
                '<option value="customer">Customer No</option>' +
                '<option value="customer_grp">Customer Group</option>' +
                '<option value="customer_hierarchy">Customer Hierarchy</option>' +
            "</select>" +
            '<input type="text" class="customer-filter-value" placeholder="Value">' +
            '<button type="button" class="customer-filter-remove" title="Remove filter">\u00d7</button>';

        activeFilters.appendChild(chip);
        return;
    }


    /* ---- sort by ---- */

    if (value === "sort_by") {

        chip.className = "filter-chip";

        chip.innerHTML =
            "<label>Sort By</label>" +
            "<select>" +
                '<option value="">-- Select --</option>' +
                '<option value="starting_date">Starting Date</option>' +
                '<option value="ending_date">Ending Date</option>' +
                '<option value="item_no">Item No</option>' +
                '<option value="sales_price">Sales Price</option>' +
            "</select>" +
            '<button type="button" class="remove-filter" title="Remove filter">\u00d7</button>';

        activeFilters.appendChild(chip);
        return;
    }


    /* ---- generic ---- */

    const label = value
        .replace(/_/g, " ")
        .replace(/\b\w/g, function (c) { return c.toUpperCase(); });

    let inputType = "text";

    if (DATE_FILTERS.indexOf(value) !== -1) {
        inputType = "datetime-local";
    } else if (NUMBER_FILTERS.indexOf(value) !== -1) {
        inputType = "number";
    }

    chip.className = "filter-chip";

    chip.innerHTML =
        "<label>" + escapeHtml(label) + "</label>" +
        '<input type="' + inputType + '"' +
        (inputType === "datetime-local" ? ' step="1"' : "") +
        (inputType === "number" ? ' step="any"' : "") +
        ' placeholder="' + escapeHtml(label) + '">' +
        '<button type="button" class="remove-filter" title="Remove filter">\u00d7</button>';

    activeFilters.appendChild(chip);

    const focusable = chip.querySelector("input, select");

    if (focusable) {
        focusable.focus();
    }
});

activeFilters.addEventListener("click", function (event) {

    const removeButton = event.target.closest(".customer-filter-remove, .remove-filter");

    if (!removeButton) {
        return;
    }

    const chip = removeButton.closest(".filter-chip");

    if (chip) {
        chip.remove();
    }
});

function collectFilters() {

    const filters = {};

    activeFilters.querySelectorAll(".filter-chip").forEach(function (chip) {

        /* customer / group / hierarchy */
        if (chip.classList.contains("customer-hierarchy-filter")) {

            const type  = chip.querySelector(".customer-filter-type");
            const value = chip.querySelector(".customer-filter-value");

            if (type && value && value.value.trim()) {
                filters[type.value] = value.value.trim();
            }

            return;
        }

        const key   = chip.id.replace("filter-", "");
        const field = chip.querySelector("input, select");

        if (!field || !field.value.trim()) {
            return;
        }

        let value = field.value.trim();

        if (field.type === "datetime-local") {
            value = toBackendDateTime(value);
        }

        filters[key] = value;
    });

    return filters;
}


/* =========================================================
   FETCH
   ========================================================= */

function discardPendingOrConfirm() {

    if (pendingUpdates.size === 0 && !hasPendingNewRows()) {
        return true;
    }

    return confirm("You have unsaved changes. Fetching will discard them. Continue?");
}

function fetchAndPopulate(page) {

    currentPage = page || 1;

    const itemNumbers = Array.from(document.querySelectorAll(".itemNoInput"))
        .map(function (input) { return input.value.trim(); })
        .filter(function (value) { return value !== ""; });

    const payload = {
        item_no: itemNumbers,
        active:  document.getElementById("fetchActive").value,
        filters: collectFilters(),
        page:    currentPage,
        limit:   PAGE_SIZE
    };

    console.log("Fetch payload:", payload);

    tableBody.innerHTML =
        '<tr><td colspan="' + (COLUMNS.length + 1) + '"' +
        ' style="text-align:center; padding:20px; color:#777;">Loading…</td></tr>';

    fetch(API.fetch, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
    })
    .then(function (response) {

        return response.json().then(function (result) {

            if (!response.ok) {
                throw new Error(result.error || "Failed to fetch items");
            }

            return result;
        });
    })
    .then(function (result) {

        items = result.data || result.items || result.message || [];

        totalRows = result.total || items.length;

        pendingUpdates.clear();

        renderTable();
        renderPagination();
        refreshSaveButtonState();
    })
    .catch(function (error) {

        console.error("Fetch error:", error);

        tableBody.innerHTML =
            '<tr><td colspan="' + (COLUMNS.length + 1) + '"' +
            ' style="text-align:center; padding:20px; color:#777;">' +
            "No Items Found</td></tr>";

        alert("Unable to fetch data");
    });
}
document.getElementById("fetchForm").addEventListener("submit", function (event) {

    event.preventDefault();

    if (discardPendingOrConfirm()) {
        fetchAndPopulate();
    }
});

document.getElementById("fetchActive").addEventListener("change", function () {

    if (discardPendingOrConfirm()) {
        fetchAndPopulate();
    }
});

/* =========================================================
   SAVE
   ========================================================= */

/* Sends a payload to the server and parses the JSON reply.
   `body` is already DB-ready (toDbPayload applied by the caller). */
function sendJson(url, method, body) {

    return fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
    })
    .then(function (response) {

        return response.json()
            .catch(function () {
                throw new Error("Server returned HTTP " + response.status);
            })
            .then(function (result) {

                if (
                    !response.ok ||
                    result.success === false ||
                    result.status === "error"
                ) {
                    throw new Error(result.error || result.message || "Save failed");
                }

                return result;
            });
    });
}

/* NEW rows: one POST per row (the create endpoint takes a single object). */
function sendRow(url, method, data) {
    return sendJson(url, method, toDbPayload(data));
}

/* EDITED rows: ONE PUT carrying the whole list. */
function sendUpdates(url, list) {
    return sendJson(url, "PUT", list.map(toDbPayload));
}

saveButton.addEventListener("click", function () {

    // Commit any editor still open
    const openEditor = tableBody.querySelector("td.editable-cell input");

    if (openEditor) {
        openEditor.blur();
    }

    const newRows = collectNewRows();
    const updates = Array.from(pendingUpdates.values());

    if (newRows.length === 0 && updates.length === 0) {
        alert("No changes to save.");
        return;
    }

    // Validate new rows up front — nothing is sent if one fails
    for (let index = 0; index < newRows.length; index++) {

        if (!validateItem(newRows[index].data, "insert")) {

            const input = newRows[index].row.querySelector('[data-field="item_no"]');

            if (input) {
                input.focus();
            }

            return;
        }
    }

    // Logged ONCE per Save click (not once per row)
    console.log("Saving", newRows.length, "new row(s),", updates.length, "update(s)");
    console.log("Updates:", updates);

    saveButton.disabled = true;

    const originalText = saveButton.innerText;

    saveButton.innerText = "Saving...";

    // New rows: one POST each. Edits: a single PUT with a list.
    const jobs = newRows.map(function (entry) {
        return sendRow(API.save, "POST", entry.data);
    });

    if (updates.length > 0) {
        jobs.push(sendUpdates(API.upDate, updates));
    }

    Promise.all(jobs)
        .then(function (results) {

            // Results come back in the same order the jobs were pushed:
            //   [ create#1, create#2, ..., updateBatch ]
            const createResults = results.slice(0, newRows.length);
            const updateResult  = updates.length > 0
                ? results[results.length - 1]
                : null;

            const lines = [];

            /* ---- create API:  { status, message, id } ---- */

            if (createResults.length > 0) {

                const ids = createResults
                    .map(function (r) { return r.id; })
                    .filter(function (id) { return id !== undefined && id !== null; });

                lines.push(
                    createResults.length + " item(s) created"
                );
            }

            /* ---- update API:  { updated_count, updated, failed_count, failed } ---- */

            if (updateResult) {

                const updatedCount = updateResult.updated_count ?? 0;
                const failedCount  = updateResult.failed_count  ?? 0;
                const failed       = updateResult.failed || [];

                lines.push(updatedCount + " item(s) updated.");

                if (failedCount > 0) {

                    lines.push("");
                    lines.push(failedCount + " item(s) failed:");

                    failed.forEach(function (entry) {

                        const id = entry.id ?? "?";
                        const why = entry.error || entry.reason ||
                                    entry.message || JSON.stringify(entry);

                        lines.push("  \u2022 id " + id + ": " + why);
                    });
                }
            }

            alert(lines.join("\n"));

            newRows.forEach(function (entry) { entry.row.remove(); });

            pendingUpdates.clear();

            // Reloading shows the true DB state, so any row that
            // failed to update reappears with its old values.
            fetchAndPopulate();
        })
        .catch(function (error) {

            console.error("Save error:", error);
            alert("Unable to save: " + error.message);
        })
        .finally(function () {

            saveButton.innerText = originalText;
            refreshSaveButtonState();
        });
});


/* =========================================================
   CSV EXPORT (client-side, from the current result set)
   ========================================================= */

document.getElementById("downloadCsvBtn").addEventListener("click", function () {

    const headers = COLUMNS.map(function (column) { return column.label; });

    function cell(value) {
        return '"' + String(value ?? "").replace(/"/g, '""') + '"';
    }

    const rows = items.map(function (item) {

        return COLUMNS.map(function (column) {

            if (column.type === "active") {
                return cell(item.active ? "TRUE" : "FALSE");
            }

            return cell(item[column.key]);

        }).join(",");
    });

    const csv  = [headers.join(",")].concat(rows).join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url  = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href     = url;
    link.download = "item_management.csv";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);
});

document.getElementById("uploadBtn").addEventListener("click", function () {

    const uploadButton = this;
    const fileInput    = document.getElementById("fileUpload");
    const file         = fileInput.files[0];

    if (!file) {
        alert("Please choose a CSV file to upload.");
        return;
    }

    const formData = new FormData();

    formData.append("file", file);
    formData.append("action", document.getElementById("actionSelect").value);

    csvOverlay.style.display = "flex";

    uploadButton.disabled = true;

    const originalHtml = uploadButton.innerHTML;

    uploadButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

    fetch(API.import, { method: "POST", body: formData })
    .then(function (response) {

        // A 400 can still carry rejected_rows, so read the body first.
        return response.json()
            .catch(function () {
                throw new Error("Server returned HTTP " + response.status);
            })
            .then(function (result) {
                return { ok: response.ok, result: result };
            });
    })
    .then(function (payload) {

        const result   = payload.result;
        const rejected = result.rejected_rows;

        if (rejected && rejected.length > 0) {

            const headers = Object.keys(rejected[0].row).concat("error");

            const csvRows = [headers.join(",")].concat(

                rejected.map(function (entry) {

                    return headers.map(function (header) {

                        const value = header === "error"
                            ? entry.error
                            : entry.row[header];

                        return '"' + String(value ?? "").replace(/"/g, '""') + '"';

                    }).join(",");
                })
            );

            const blob = new Blob([csvRows.join("\n")], {
                type: "text/csv;charset=utf-8;"
            });

            const url  = URL.createObjectURL(blob);
            const link = document.createElement("a");

            link.href     = url;
            link.download = "rejected_rows.csv";

            document.body.appendChild(link);
            link.click();
            link.remove();

            URL.revokeObjectURL(url);
        }

        if (!payload.ok || result.success === false) {
            throw new Error(result.error || "Import failed");
        }

        alert(result.message || "CSV imported successfully.");

        csvPopup.style.display = "none";

        fileInput.value = "";

        fetchAndPopulate();
    })
    .catch(function (error) {

        console.error("Import error:", error);
        alert("Unable to import CSV: " + error.message);
    })
    .finally(function () {

        csvOverlay.style.display = "none";

        uploadButton.disabled  = false;
        uploadButton.innerHTML = originalHtml;
    });
});
