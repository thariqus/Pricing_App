<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Messages | Pricing Application</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/item_management.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/logs.css') }}">
</head>

<body>

<div class="logs-container">

    <div class="top-bar">
        <div class="top-bar-title">
            <span style="display:flex; align-items:center; gap:10px;">
                <i class="fas fa-list"></i>
                Log Messages
            </span>

            <nav class="page-nav">
                <a href="{{ url_for('index_call') }}" class="page-nav-link">
                    <i class="fas fa-tags"></i> Items
                </a>
                <a href="{{ url_for('integration') }}" class="page-nav-link">
                    <i class="fas fa-network-wired"></i> Integration
                </a>
                <a href="{{ url_for('settings') }}" class="page-nav-link">
                    <i class="fas fa-gear"></i> Settings
                </a>
                <a href="{{ url_for('log_message') }}" class="page-nav-link active">
                    <i class="fas fa-list"></i> Logs
                </a>
            </nav>
        </div>

        <div class="logs-toolbar">
            <span class="logs-subtitle">Pricing Application - Database Logs</span>
        </div>
    </div>

    <section class="logs-card">
        <div class="card-head">
            <h2><i class="fas fa-database"></i> Log Records</h2>
            <span class="total-badge">Total: <span id="totalCount">0</span></span>
        </div>

        <div class="logs-table-wrap">
            <table class="logs-table" id="logTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Custom Message</th>
                        <th>Response Message</th>
                        <th>Source</th>
                        <th>Type</th>
                        <th>Site</th>
                        <th>Message Code</th>
                        <th>Log Status</th>
                        <th>Info</th>
                        <th>Error</th>
                        <th>Created At</th>
                    </tr>
                </thead>

                <tbody id="logTbody" data-endpoint="{{ url_for('api_logs') }}"></tbody>
            </table>
        </div>

        <div class="logs-footer">
            Showing <span id="visibleCount">0</span> record(s)
        </div>
    </section>

</div>

<script src="{{ url_for('static', filename='js/log_message.js') }}"></script>
</body>
</html>
