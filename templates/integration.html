<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Price Integration</title>
  <style>
    :root {
      --bg: #f6f6f7;
      --card: #fde8e6;
      /* store pink card */
      --card-solid: #fff;
      --border: #f3d3cf;
      --text: #1f2937;
      --muted: #6b7280;
      --navy: #1e2a4a;
      --ho: #b3121f;
      /* store crimson */
      --ho-dark: #8f0e19;
      --connected: #b3121f;
      /* live link = store crimson */
      --syncing: #e08a1e;
      /* warm amber */
      --disconnected: #9ca3af;
      /* offline = muted grey */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Page shell + header */
    .shell {
      position: relative;
      max-width: 1500px;
      margin: 30px auto;
      padding: 28px;
      background: #fafafc;
      border: 1px solid #eee;
      border-radius: 16px;
      overflow: hidden;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: var(--card);
      opacity: .7;
      pointer-events: none;
    }

    .shell::before {
      width: 220px;
      height: 140px;
      top: -60px;
      right: 40px;
      transform: rotate(-20deg);
    }

    .shell::after {
      width: 160px;
      height: 160px;
      bottom: -90px;
      left: -40px;
    }

    .page-head {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 24px;
    }

    .page-head h1 {
      margin: 0;
      font-size: 1.8rem;
      font-weight: 800;
      letter-spacing: .5px;
      color: var(--ho);
    }

    .page-head h1 span {
      color: var(--navy);
    }

    .page-head h1::after {
      content: "";
      display: block;
      width: 36px;
      height: 3px;
      margin-top: 4px;
      border-radius: 2px;
      background: var(--ho);
    }

    .page-head p {
      margin: 6px 0 0;
      font-size: .85rem;
      color: var(--muted);
    }

    .stop-all-btn {
      margin-left: auto;
      align-self: center;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--ho);
      color: #fff;
      font-weight: 700;
      letter-spacing: .3px;
      cursor: default;
      box-shadow: 0 4px 12px rgba(179, 18, 31, .25);
    }

    /* Dual display: site links left, detail panel right */
    .dual {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 500px) minmax(0, 1fr);
      gap: 20px;
      align-items: stretch;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Loading / error message shown inside .links */
    .loading-msg {
      margin: 0;
      padding: 20px;
      text-align: center;
      color: var(--muted);
    }

    .loading-msg.error {
      color: #991b1b;
    }

    .side-panel {
      padding: 8px;
      background: var(--card-solid);
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(30, 42, 74, .06);
    }

    .side-inner {
      height: 100%;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      border: 1.5px dashed #f2b8b2;
      border-radius: 10px;
    }

    @media (max-width: 1000px) {
      .dual {
        grid-template-columns: 1fr;
      }

      .shell {
        margin: 16px;
        padding: 18px;
      }
    }

    .link-row {
      --color: var(--connected);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      grid-template-areas:
        "ho   title flag  chev"
        ".    wire  site  info";
      align-items: center;
      column-gap: 14px;
      row-gap: 10px;
      background: linear-gradient(100deg, #fff 35%, var(--card));
      padding: 16px 20px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(179, 18, 31, .06);
    }

    .link-row .node.ho {
      grid-area: ho;
    }

    .link-row .site-title {
      grid-area: title;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .site-title strong {
      color: var(--navy);
      font-size: .95rem;
    }

    .site-title small {
      color: var(--muted);
      font-size: .72rem;
    }

    .link-row .chevron {
      grid-area: chev;
      align-self: start;
      color: var(--muted);
      font-size: 1.4rem;
      line-height: 1;
      text-decoration: none;
    }

    .link-row .chevron:hover {
      color: var(--ho);
    }

    .link-row .wire {
      grid-area: wire;
    }

    .link-row .node.site {
      grid-area: site;
    }

    .link-row .info-btn {
      grid-area: info;
    }

    .link-row.syncing {
      --color: var(--syncing);
    }

    .link-row.disconnected {
      --color: var(--disconnected);
    }

    /* Nodes: HO and site */
    .node {
      flex: 0 0 auto;
      min-width: 70px;
      padding: 12px 14px;
      text-align: center;
      font-weight: 700;
      border-radius: 10px;
      letter-spacing: .5px;
    }

    .node.ho {
      background: var(--ho);
      color: #fff;
    }

    .node.site {
      padding: 8px 14px;
      border: 2px solid var(--color);
      color: var(--color);
      background: var(--card-solid);
    }

    .link-row.disconnected .node.site {
      border-style: dashed;
    }

    /* Running / Stopped flag */
    .flag-status {
      grid-area: flag;
      justify-self: center;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px 3px 6px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 700;
      color: #16a34a;
      background: rgba(22, 163, 74, .1);
    }

    .flag-pole {
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }

    .flag-cloth {
      fill: currentColor;
      transform-origin: 5px 8px;
      animation: wave 1s ease-in-out infinite;
    }

    .link-row.disconnected .flag-status {
      color: var(--ho);
      background: rgba(179, 18, 31, .1);
    }

    .link-row.disconnected .flag-cloth {
      animation: none;
    }

    @keyframes wave {
      50% {
        transform: skewY(-8deg) scaleX(.9);
      }
    }

    .wire {
      position: relative;
      height: 30px;
    }

    /* ECG heartbeat trace */
    .ecg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .ecg path {
      fill: none;
      stroke: var(--color);
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .ecg-base {
      stroke-width: 1.5;
      opacity: .22;
    }

    .ecg-pulse {
      stroke-width: 2.4;
      stroke-dasharray: 22 100;
      stroke-dashoffset: 22;
      filter: drop-shadow(0 0 3px var(--color));
      animation: ecg-sweep 2.2s linear infinite;
    }

    .link-row.syncing .ecg-pulse {
      animation-duration: 4.4s;
    }

    .link-row:nth-child(2n) .ecg-pulse {
      animation-delay: -.8s;
    }

    .link-row.disconnected .ecg path {
      d: path("M0 15 H200");
    }

    .link-row.disconnected .ecg-base {
      opacity: .5;
      stroke-dasharray: 2 2;
    }

    .link-row.disconnected .ecg-pulse {
      display: none;
    }

    /* Info button */
    .info-btn {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      background: transparent;
      color: var(--text);
      font: italic 700 15px Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      cursor: pointer;
      transition: .2s;
    }

    .info-btn:hover {
      background: var(--ho);
      border-color: var(--ho);
      color: #fff;
    }

    @keyframes ecg-sweep {
      to {
        stroke-dashoffset: -100;
      }
    }

    @media (max-width: 520px) {
      .link-row {
        padding: 14px;
        gap: 8px;
      }

      .node {
        min-width: 52px;
        padding: 10px 8px;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="page-head">
      <div>
        <h1><span>PRICE</span> INTEGRATION</h1>
        <p>Connect and manage your sites</p>
      </div>
      <!-- Stop All: placeholder, no action wired yet -->
      <button type="button" class="stop-all-btn" id="stop-all-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" />
        </svg>
        <span>Stop All</span>
      </button>
    </header>

    <div class="dual">
      <!-- Site rows are built by the script below from /api/integration/status -->
      <main class="links" id="links" aria-live="polite">
        <p class="loading-msg">Loading sites...</p>
      </main>

      <aside class="side-panel" id="side-panel">
        <div class="side-inner">
          <p> ..................</p>
        </div>
      </aside>
    </div>
  </div>

  <script>
    const API_URL = "/api/items/integration_check";
    const DETAIL_URL = "/site-details/__CODE__";
    const REFRESH_MS = 10 * 60 * 1000; // 10 minutes
    // const REFRESH_MS = 1 * 60 * 1000;

    const linksEl = document.getElementById("links");
    let loading = false;

    const ECG_PATH =
      "M0 15 H40 L45 12 L50 15 H56 L60 18 L65 3 L70 27 L74 15 H80 L86 11 L92 15 H120 L125 12 L130 15 H136 L140 18 L145 3 L150 27 L154 15 H160 L166 11 L172 15 H200";

    // Escape text before putting it into HTML
    function esc(value) {
      const d = document.createElement("div");
      d.textContent = value ?? "";
      return d.innerHTML;
    }

    // One site row (same markup the old Jinja loop produced)
    function siteRow(ho, site) {
      const stopped = site.status === "disconnected";
      const code = esc(site.code);
      const detailUrl = DETAIL_URL.replace("__CODE__", encodeURIComponent(site.code));

      return `
        <div class="link-row ${esc(site.status)}" data-code="${code}">
          <div class="node ho" title="${esc(ho.name)}">${esc(ho.code)}</div>

          <div class="site-title">
            <strong>Site ${code}</strong>
          </div>

          <span class="flag-status">
            <svg class="flag" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path class="flag-pole" d="M5 3v18" />
              <path class="flag-cloth" d="M5 4h12l-2.5 4L17 12H5z" />
            </svg>
            <span class="flag-label">${stopped ? "Stopped" : "Running"}</span>
          </span>

          <a class="chevron" href="${detailUrl}" aria-label="Open site ${code}">&rsaquo;</a>

          <div class="wire ecg-wire">
            <svg class="ecg" viewBox="0 0 200 30" preserveAspectRatio="none" aria-hidden="true">
              <path class="ecg-base" pathLength="100" d="${ECG_PATH}" />
              <path class="ecg-pulse" pathLength="100" d="${ECG_PATH}" />
            </svg>
          </div>

          <div class="node site">${code}</div>

          <a class="info-btn" href="${detailUrl}" aria-label="Info for site ${code}">i</a>
        </div>`;
    }

    function render(data) {
      if (!data.sites || !data.sites.length) {
        linksEl.innerHTML = '<p class="loading-msg">No sites configured.</p>';
        return;
      }
      linksEl.innerHTML = data.sites.map(s => siteRow(data.head, s)).join("");
    }

    async function loadSites() {
      if (loading) return; // skip if the previous call is still running
      loading = true;
      try {
        const res = await fetch(API_URL, { headers: { Accept: "application/json" } });
        if (!res.ok) throw new Error("HTTP " + res.status);
        render(await res.json());
      } catch (err) {
        console.error("Failed to load integration status:", err);
        // Keep the old rows if we have them; show an error only when nothing has loaded yet
        if (!linksEl.querySelector(".link-row")) {
          linksEl.innerHTML =
            '<p class="loading-msg error">Could not load sites. Retrying in 10 minutes.</p>';
        }
      } finally {
        loading = false;
      }
    }

    loadSites();                        // once when the page opens
    setInterval(loadSites, REFRESH_MS); // then every 10 minutes, without reloading the page
  </script>
</body>

</html>
