<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Price Integration</title>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/item_management.css') }}">

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/integration.css') }}">

<script src="{{ url_for('static', filename='js/integration.js') }}" defer></script>

</head>


<body>

<div class="integration-container">

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="top-bar">

        <div class="top-bar-title">

            <span style="display:flex; align-items:center; gap:10px;">
                <i class="fas fa-network-wired"></i>
                Price Integration
            </span>

            <nav class="page-nav">
                <a href="{{ url_for('index_call') }}" class="page-nav-link">
                    <i class="fas fa-tags"></i> Items
                </a>
                <a href="{{ url_for('integration') }}" class="page-nav-link active">
                    <i class="fas fa-network-wired"></i> Integration
                </a>
                <a href="{{ url_for('settings') }}" class="page-nav-link">
                    <i class="fas fa-gear"></i> Settings
                </a>
                <a href="{{ url_for('log_message') }}" class="page-nav-link">
                    <i class="fas fa-list"></i> Logs
                </a>
            </nav>

        </div>

        <div class="integration-toolbar">

            <div class="integration-info">
                <span class="integration-subtitle">Connect and manage your sites</span>

                <div class="legend">
                    <span><i class="dot connected"></i> Running</span>
                    <span><i class="dot syncing"></i> Syncing</span>
                    <span><i class="dot disconnected"></i> Stopped</span>
                </div>
            </div>

            <!-- Stop All: placeholder, no action wired yet -->
            <button type="button" class="btn btn-outline" id="stop-all-btn">
                <i class="fas fa-stop"></i> Stop All
            </button>

        </div>

    </div>


    <!-- =====================================================
         SITE LINKS + SIDE PANEL
         ===================================================== -->

    <div class="dual">

        <!-- Site rows are built by integration.js from /api/items/integration_check -->
        <main class="links-card">

            <div class="card-head">
                <h2><i class="fas fa-store"></i> Sites</h2>
            </div>

            <div class="links" id="links" aria-live="polite">
                <p class="loading-msg">Loading sites...</p>
            </div>

        </main>

        <aside class="side-panel" id="side-panel">

            <div class="card-head">
                <h2><i class="fas fa-circle-info"></i> Details</h2>
            </div>

            <div class="side-inner">
                <i class="fas fa-satellite-dish side-icon"></i>
                <p>Select a site to see its details.</p>
            </div>

        </aside>

    </div>

</div>

</body>

</html>
